name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild mbpm.sln -restore -p:Configuration=Release -p:Platform="Any CPU"
      - uses: actions/upload-artifact@v4
        with:
          name: mbpm
          path: |
            bin/Release/mbpm.exe
            bin/Release/mbpm.exe.config